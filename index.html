<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MaGrandMère.com</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6e9d3;--card:#fffaf0;--ink:#4a2f1d;--mute:#8a6f58;--acc:#c0566b;--line:#e2cba8;--wall:#f3d9c0;--floor:#b98a5e;--bar:#e8d8bd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#2a1f18;--card:#3a2c22;--ink:#f3e4cf;--mute:#c4aa8c;--acc:#e07a8f;--line:#5a4533;--wall:#5b4334;--floor:#6e4f35;--bar:#4a3828}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#2a1f18;--card:#3a2c22;--ink:#f3e4cf;--mute:#c4aa8c;--acc:#e07a8f;--line:#5a4533;--wall:#5b4334;--floor:#6e4f35;--bar:#4a3828}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:14px}
h1{margin:4px 0 2px;text-align:center;font-size:26px;color:var(--acc)}
.sub{text-align:center;color:var(--mute);font-size:13px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.top input{font:inherit;font-size:16px;font-weight:bold;background:transparent;border:0;border-bottom:1px dashed var(--mute);color:var(--ink);width:140px}
.love{display:flex;align-items:center;gap:6px;font-size:13px}
.lbar{width:90px;height:12px;background:var(--bar);border-radius:6px;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:var(--acc);border-radius:6px;transition:width .4s}
.scene{border:3px solid var(--line);border-radius:14px;overflow:hidden;background:var(--wall)}
.scene svg{display:block;width:100%;height:auto}
.pend{transform-origin:54px 106px;animation:sw 2s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.pend{animation:none}}
.bubble{position:relative;margin:12px 0 0;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;min-height:38px}
.bubble::before{content:"";position:absolute;top:-9px;left:50%;border:8px solid transparent;border-top:0;border-bottom-color:var(--line)}
.stats{margin:10px 0;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.st{font-size:13px}.bar{height:12px;background:var(--bar);border-radius:6px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-size:14px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 6px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.45;cursor:default}
button small{display:block;color:var(--mute);font-size:11px}
.foot{margin-top:12px;font-size:13px;color:var(--mute);text-align:center}
.knit{margin-top:8px;font-size:13px;text-align:center}
.reset{background:none;border:0;text-decoration:underline;font-size:12px;color:var(--mute);padding:4px}
</style>
</head>
<body>
<div class="app">
<h1>MaGrandMère.com</h1>
<div class="sub">Prends soin de ta mamie, elle ne rajeunit pas.</div>
<div class="top"><input id="name" maxlength="18" aria-label="Nom de la mamie">
<div class="love" title="À 10 points d’amour, les petits-enfants viennent faire un coucou !"><svg viewBox="0 0 24 22" width="22" height="20"><path d="M12 21C4 14 1 10 1 6.5A5.5 5.5 0 0 1 12 4a5.5 5.5 0 0 1 11 2.5C23 10 20 14 12 21z" fill="var(--acc)"/></svg><div class="lbar"><i id="lovebar"></i></div><b id="lovenum"></b></div></div>
<div class="scene">
<svg viewBox="0 0 400 300" aria-label="Mamie dans son salon">
<defs>
<pattern id="wp" width="40" height="44" patternUnits="userSpaceOnUse"><rect width="40" height="44" fill="var(--wall)"/><path d="M0 0v44M20 0v44" stroke="var(--line)" stroke-width="3" opacity=".6"/><g opacity=".6"><circle cx="10" cy="9" r="2.6" fill="#c0566b"/><circle cx="10" cy="15" r="2.6" fill="#c0566b"/><circle cx="7" cy="12" r="2.6" fill="#c0566b"/><circle cx="13" cy="12" r="2.6" fill="#c0566b"/><circle cx="10" cy="12" r="1.6" fill="#f2c14e"/><path d="M30 32q4-6 8 0q-4 4-8 0z" fill="#6aa876"/></g></pattern>
<pattern id="cur" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#7a4a2a"/><path d="M6 1l4 5-4 5-4-5z" fill="#c99a6b"/><circle cx="0" cy="0" r="1.5" fill="#c99a6b"/><circle cx="12" cy="12" r="1.5" fill="#c99a6b"/></pattern>
<g id="gera"><rect x="266" y="126" width="22" height="11" fill="#c8683a"/><ellipse cx="277" cy="121" rx="12" ry="6" fill="#3f8f4f"/><g fill="#d0485f"><circle cx="270" cy="115" r="4"/><circle cx="278" cy="112" r="4"/><circle cx="285" cy="116" r="4"/></g></g>
</defs>
<rect width="400" height="210" fill="url(#wp)"/>
<rect y="178" width="400" height="5" fill="#8a5a3a"/><rect y="183" width="400" height="27" fill="#b98a5e" opacity=".55"/>
<rect y="210" width="400" height="90" fill="var(--floor)"/><path d="M0 232h400M0 256h400M0 280h400" stroke="#000" opacity=".12"/>
<rect x="246" y="28" width="120" height="108" rx="3" fill="#8a5a3a"/><rect x="252" y="34" width="108" height="96" fill="#bfe3f0"/>
<circle cx="340" cy="52" r="8" fill="#f2c14e"/><path d="M252 110L285 62L300 82L318 56L360 110z" fill="#9aa8b8"/><path d="M285 62l-8 12 6-3 4 5 4-5zM318 56l-9 14 7-3 5 5 5-6z" fill="#fff"/><path d="M252 118q30-22 60-8t48-6v26h-108z" fill="#6aa876"/>
<path d="M306 34v96M252 82h108" stroke="#8a5a3a" stroke-width="4"/>
<rect x="240" y="136" width="132" height="6" rx="2" fill="#8a5a3a"/>
<use href="#gera"/><use href="#gera" x="56"/>
<path d="M226 27H260Q256 80 262 140H228Q232 80 226 27Z" fill="url(#cur)"/><path d="M352 27H386Q380 80 386 140H352Q358 80 352 27Z" fill="url(#cur)"/>
<rect x="220" y="22" width="174" height="5" rx="2" fill="#5a3a22"/><circle cx="220" cy="24" r="4" fill="#5a3a22"/><circle cx="394" cy="24" r="4" fill="#5a3a22"/>
<g id="cuckoo"><path d="M14 48L54 12L94 48z" fill="#5a3a22"/><path d="M24 40h60M30 34h48M38 28h32" stroke="#3d2614" stroke-width="1.5"/><rect x="48" y="26" width="12" height="14" rx="6" fill="#2a1a10"/><g id="bird" style="display:none"><ellipse cx="54" cy="34" rx="5" ry="3.5" fill="#f2c14e"/><path d="M58 33l5 1-5 2z" fill="#d0485f"/></g>
<rect x="24" y="46" width="60" height="60" fill="#8a5a3a" stroke="#5a3a22" stroke-width="3"/>
<circle cx="54" cy="70" r="19" fill="#fff6e4" stroke="#5a3a22" stroke-width="2.5"/><g id="ticks" stroke="#4a2f1d" stroke-width="1.5"></g>
<line id="hh" x1="54" y1="70" x2="54" y2="60" stroke="#4a2f1d" stroke-width="3" stroke-linecap="round"/><line id="mh" x1="54" y1="70" x2="54" y2="56" stroke="#4a2f1d" stroke-width="2" stroke-linecap="round"/><line id="sh" x1="54" y1="74" x2="54" y2="54" stroke="#c0566b" stroke-width="1"/><circle cx="54" cy="70" r="2" fill="#c0566b"/>
<path d="M38 106v18M70 106v12" stroke="#4a2f1d" stroke-width="1.5"/><ellipse cx="38" cy="132" rx="6" ry="9" fill="#7a5230"/><ellipse cx="70" cy="126" rx="6" ry="9" fill="#7a5230"/>
<g class="pend"><path d="M54 106v32" stroke="#4a2f1d" stroke-width="1.5"/><circle cx="54" cy="142" r="6" fill="#d9a441"/></g></g>
<rect x="100" y="108" width="76" height="6" rx="2" fill="#8a5a3a"/><path d="M110 114l-8 10M166 114l8 10" stroke="#8a5a3a" stroke-width="3"/>
<g transform="translate(-27 0)"><path d="M153 66h24l-2 12q20 6 20 26q0 4-6 4h-48q-6 0-6-4q0-20 20-26z" fill="#2f5fa8"/><path d="M141 100h48M147 106h36" stroke="#fff" stroke-width="1.5" opacity=".7"/><path d="M153 70h24" stroke="#fff" stroke-width="1.5" opacity=".7"/>
<g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M172 94q6-4 5-12"/><path d="M164 100l-1 6M169 100l1 6"/></g><ellipse cx="167" cy="95" rx="9" ry="4.5" fill="#fff"/><path d="M158 94l-7-3 7 5z" fill="#fff"/><circle cx="177" cy="81" r="2.3" fill="#fff"/><path d="M179 81l5 1-5 1z" fill="#e0a030"/></g>
<g><path d="M20 262h30l-4 26H24z" fill="#c8683a"/><rect x="18" y="258" width="34" height="6" rx="2" fill="#b0562c"/><g fill="#3f8f4f"><ellipse cx="35" cy="236" rx="7" ry="24" transform="rotate(-35 35 258)"/><ellipse cx="35" cy="236" rx="7" ry="24" transform="rotate(35 35 258)"/><ellipse cx="35" cy="236" rx="7" ry="24" transform="rotate(-65 35 258)"/><ellipse cx="35" cy="236" rx="7" ry="24" transform="rotate(65 35 258)"/></g><ellipse cx="35" cy="234" rx="7" ry="26" fill="#2f7a43"/></g>
<rect x="104" y="138" width="192" height="92" rx="30" fill="#76bf9d"/><g fill="#4f9a78"><circle cx="140" cy="170" r="4"/><circle cx="200" cy="164" r="4"/><circle cx="260" cy="170" r="4"/></g><path d="M104 168q96 22 192 0" fill="none" stroke="#4f9a78" stroke-width="2" opacity=".6"/>
<rect x="90" y="206" width="220" height="44" rx="14" fill="#9fdcbf"/><rect x="76" y="168" width="40" height="84" rx="18" fill="#86cfae"/><rect x="284" y="168" width="40" height="84" rx="18" fill="#86cfae"/>
<rect x="284" y="172" width="40" height="24" rx="8" fill="#fff6e4"/><path d="M288 181h32M288 188h32" stroke="#e07a8f" stroke-width="3"/>
<rect x="86" y="248" width="10" height="12" rx="3" fill="#6b4226"/><rect x="304" y="248" width="10" height="12" rx="3" fill="#6b4226"/>
<g transform="rotate(-12 113 190)"><rect x="96" y="172" width="34" height="34" rx="7" fill="#f2c14e"/><circle cx="113" cy="189" r="6" fill="#e07a8f"/></g>
<g id="gma">
<rect x="150" y="180" width="100" height="75" rx="18" fill="#7fa6c9"/>
<rect x="168" y="200" width="64" height="55" rx="8" fill="#fff6e4"/>
<circle cx="200" cy="140" r="38" fill="#f4cfae"/>
<circle cx="200" cy="96" r="20" fill="#e8e8ee"/>
<path d="M162 135q0-45 38-45t38 45q-20-24-38-24t-38 24z" fill="#e8e8ee"/>
<circle cx="162" cy="146" r="6" fill="#f4cfae"/><circle cx="238" cy="146" r="6" fill="#f4cfae"/>
<g fill="none" stroke="#4a2f1d" stroke-width="3"><circle cx="186" cy="140" r="10"/><circle cx="214" cy="140" r="10"/><path d="M196 140h8"/></g>
<g id="eyes" fill="#4a2f1d"><circle cx="186" cy="141" r="3"/><circle cx="214" cy="141" r="3"/></g>
<circle cx="176" cy="158" r="5" fill="#ee9aa0" opacity=".7"/><circle cx="224" cy="158" r="5" fill="#ee9aa0" opacity=".7"/>
<path id="mouth" d="M188 160q12 8 24 0" fill="none" stroke="#a8445a" stroke-width="3" stroke-linecap="round"/>
<g id="knit"><path d="M130 232l55-24M270 232l-55-24" stroke="#8a5a3a" stroke-width="4"/><rect x="170" y="222" width="60" height="22" rx="6" fill="#e07a8f"/></g>
</g>
<g id="kids" style="display:none"></g>
</svg>
</div>
<div class="bubble" id="say"></div>
<div class="stats" id="stats"></div>
<div class="acts" id="acts"></div>
<div class="knit" id="knitinfo"></div>
<div class="foot">Sauvegardé automatiquement sur cet appareil. <button class="reset" id="reset">Recommencer</button></div>
</div>
<script>
(function(){
var KEY="magrandmere_v1";
var S0={name:"Mamie Rose",love:0,cakes:0,letters:0,visits:0,r:80,s:80,h:70,e:80,rows:0,scarves:0,last:Date.now()};
var S;
try{S=JSON.parse(localStorage.getItem(KEY))||null}catch(e){S=null}
S=Object.assign({},S0,S||{});if(S.name==="Mamie Ginette")S.name="Mamie Rose";
var rates={r:.25,s:.15,h:.2,e:.1};
var names={r:"Repas",s:"Santé",h:"Humeur",e:"Énergie"};
var cols={r:"#e0a030",s:"#d0485f",h:"#4aa86b",e:"#4a8fd0"};
var acts=[
{id:"soupe",t:"Soupe",d:"+repas",f:function(){S.r+=35;S.h+=3},m:["Mmh, un peu de sel et ce serait parfait.","Dans mon temps, on la faisait avec des vrais poireaux."],c:3},
{id:"med",t:"Médicament",d:"+santé",f:function(){S.s+=35},m:["Le rose, pas le bleu ! … Ou l’inverse ?","Tu as vu mes lunettes ? Ah, elles sont sur mon nez."],c:3},
{id:"journal",t:"Journal",d:"+humeur",f:function(){S.h+=25;S.e-=3},m:["Regarde-moi ça, les prix ont encore augmenté !","Tiens, un avis de décès… ah, c’est le voisin."],c:4},
{id:"tricot",t:"Tricoter",d:"+humeur, +amour",f:function(){S.h+=12;S.e-=12;S.r-=4;S.rows++;if(S.rows>=5){S.rows=0;S.scarves++;S.love+=5;say("Une écharpe pour les petits-enfants ! Ils vont être contents.")}},m:["Une maille à l’endroit, une maille à l’envers…","Ça sera un pull. Ou une écharpe. On verra."],c:2},
{id:"gateau",t:"Gâteau",d:"+humeur, +amour",f:function(){S.h+=15;S.e-=10;S.r+=5;S.love+=3;S.cakes++},m:["Un gâteau au chocolat pour les petits. Pas touche avant le goûter !","Une pincée de cannelle, c’est mon secret. Chut !"],c:6},
{id:"lettre",t:"Écrire une lettre",d:"aux petits-enfants, +amour",f:function(){S.h+=12;S.e-=8;S.love+=3;S.letters++},m:["Mes chers petits, je vous embrasse très fort. Mettez une veste !","Je glisse un billet de cinq francs dans l’enveloppe. Ne le dis à personne."],c:6},
{id:"docteur",t:"Docteur",d:"+santé, gratuit",f:function(){S.s+=55;S.h-=5;S.e-=8},m:["Le docteur dit que je suis en pleine forme pour mon âge.","Une heure d’attente pour trois minutes… mais il est charmant."],c:12},
{id:"sieste",t:"Sieste",d:"+énergie",f:function(){S.e+=40;S.r-=5},m:["Zzz… je ne dormais pas, je me reposais les yeux.","Réveille-moi pour le feuilleton."],c:20}
];
var cd={},kv=0;
var $=function(i){return document.getElementById(i)};
function clamp(){["r","s","h","e"].forEach(function(k){S[k]=Math.max(0,Math.min(100,S[k]))});S.love=Math.max(0,S.love||0)}
function clock(){var d=new Date(),s=d.getSeconds(),m=d.getMinutes()+s/60,h=(d.getHours()%12)+m/60;
$("hh").setAttribute("transform","rotate("+h*30+" 54 70)");$("mh").setAttribute("transform","rotate("+m*6+" 54 70)");$("sh").setAttribute("transform","rotate("+s*6+" 54 70)");
$("bird").style.display=(d.getMinutes()%30===0&&s<5)?"block":"none"}
function kid(x,s,shirt,girl,hair){
var h='<g transform="translate('+x+' 292) scale('+s+')">';
h+='<rect x="-7" y="-26" width="6" height="26" fill="#3b3a5a"/><rect x="1" y="-26" width="6" height="26" fill="#3b3a5a"/><rect x="-9" y="-4" width="9" height="4" rx="2" fill="#4a2f1d"/><rect x="0" y="-4" width="9" height="4" rx="2" fill="#4a2f1d"/>';
h+='<path d="M-12 -46l-8-12M12 -46l8-12" stroke="#f4cfae" stroke-width="5" stroke-linecap="round" fill="none"/>';
h+=girl?'<path d="M-11 -50h22l6 28h-34z" fill="'+shirt+'"/>':'<rect x="-12" y="-50" width="24" height="28" rx="6" fill="'+shirt+'"/>';
h+='<circle cy="-62" r="12" fill="#f4cfae"/><path d="M-13 -62q1-16 13-16t13 16q-4-8-13-8t-13 8z" fill="#4a2c17"/>';
if(hair===1)h+='<circle cx="-14" cy="-58" r="5" fill="#4a2c17"/><circle cx="14" cy="-58" r="5" fill="#4a2c17"/>';
if(hair===2)h+='<circle cx="11" cy="-73" r="6" fill="#4a2c17"/><circle cx="8" cy="-70" r="2.5" fill="#d0485f"/>';
h+='<circle cx="-4" cy="-62" r="1.8" fill="#4a2f1d"/><circle cx="4" cy="-62" r="1.8" fill="#4a2f1d"/><circle cx="-8" cy="-57" r="2.5" fill="#ee9aa0" opacity=".7"/><circle cx="8" cy="-57" r="2.5" fill="#ee9aa0" opacity=".7"/><path d="M-4 -56q4 4 8 0" fill="none" stroke="#a8445a" stroke-width="1.6"/></g>';
return h}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function say(t){$("say").textContent=t}
function decay(){var n=Date.now(),m=Math.min(480,(n-S.last)/60000);S.last=n;for(var k in rates)S[k]-=rates[k]*m;clamp()}
function mood(){return Math.min(S.r,S.s,S.h,S.e)}
function idle(){if(Date.now()<kv)return;var lo=mood(),q;
if(S.r<20)q="J’ai un petit creux… la soupe, c’est pour les chiens ?";
else if(S.s<20)q="Mes médicaments, mon petit… j’ai la tête qui tourne.";
else if(S.h<20)q="Personne ne m’apporte jamais le journal…";
else if(S.e<20)q="Je suis fatiguée, je vais fermer les yeux cinq minutes.";
else if(lo>60)q=["Quel beau temps pour un tricot !","Tu as mis une veste ? Il fait frais.","Tu manges bien, au moins ?"][Math.floor(Math.random()*3)];
else q="Ça va, ça va, on fait aller.";
say(q)}
function checkVisit(){if(S.love>=10&&Date.now()>=kv){S.visits++;S.h+=40;S.s+=10;S.e+=10;clamp();kv=Date.now()+20000;$("kids").style.display="block";
say("Mamie ! Mamie ! On est venus te faire un gros bisou ! — Mes petits trésors ! Venez, j’ai gardé du gâteau.");
setTimeout(function(){$("kids").style.display="none";S.love=0;kv=0;save();render();idle()},20000)}}
function render(){
var lo=mood(),sad=lo<25,ok=lo<55,lv=Math.min(10,S.love);
$("mouth").setAttribute("d",sad?"M188 168q12-9 24 0":ok?"M188 164h24":"M188 160q12 10 24 0");
$("eyes").style.opacity=S.e<15?.15:1;
$("lovebar").style.width=lv*10+"%";$("lovenum").textContent=lv+"/10";
$("stats").innerHTML=["r","s","h","e"].map(function(k){var v=Math.round(S[k]);return '<div class="st">'+names[k]+' <b>'+v+'%</b><div class="bar"><i style="width:'+v+'%;background:'+cols[k]+'"></i></div></div>'}).join("");
$("knitinfo").textContent="Écharpe en cours : "+S.rows+"/5 rangs · Écharpes : "+S.scarves+" · Gâteaux : "+S.cakes+" · Lettres : "+S.letters+" · Visites : "+S.visits;
acts.forEach(function(a){var b=$("b_"+a.id);if(b)b.disabled=!!(cd[a.id]>Date.now())})}
function build(){
$("acts").innerHTML=acts.map(function(a){return '<button id="b_'+a.id+'">'+a.t+'<small>'+a.d+'</small></button>'}).join("");
acts.forEach(function(a){$("b_"+a.id).onclick=function(){decay();
if(a.id==="soupe"&&S.r>92){say("Merci, j’ai déjà trop mangé !");return}
if(a.id==="sieste"&&S.e>92){say("Je n’ai pas sommeil, je ne suis pas une petite vieille !");return}
a.f();clamp();
if(a.id!=="tricot"||S.rows!==0)say(a.m[Math.floor(Math.random()*a.m.length)]);
cd[a.id]=Date.now()+a.c*1000;checkVisit();save();render();setTimeout(render,a.c*1000+50)}})}
$("name").value=S.name;
$("name").onchange=function(){S.name=$("name").value||"Mamie";save()};
$("reset").onclick=function(){if(confirm("Tout recommencer avec une nouvelle mamie ?")){S=Object.assign({},S0,{last:Date.now()});$("name").value=S.name;save();render();say("Bonjour mon petit, entre donc !")}};
$("kids").innerHTML=kid(292,1,"#4a8fd0",false,0)+kid(337,.88,"#d0485f",true,1)+kid(372,.72,"#e0a030",true,2);
build();decay();render();
(function(){var t="";for(var i=0;i<12;i++)t+='<path d="M54 52v'+(i%3?2:4)+'" transform="rotate('+i*30+' 54 70)"/>';$("ticks").innerHTML=t})();
clock();setInterval(clock,1000);
say("Bonjour mon petit, entre donc ! Tu veux un bonbon ?");
setTimeout(idle,4500);
setInterval(function(){decay();save();render()},5000);
setInterval(idle,15000);
})();
</script>
</body>
</html>
