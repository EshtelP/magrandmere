<title>MaGrandMère.com</title>
<style>
:root{box-sizing:border-box;--bg:#f6e9d3;--card:#fffaf0;--ink:#4a2f1d;--mute:#8a6f58;--acc:#c0566b;--line:#e2cba8;--wall:#f3d9c0;--floor:#b98a5e;--bar:#e8d8bd}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
button{font:inherit;color:inherit}
.app{width:min(100%,560px);height:100vh;height:100dvh;margin:auto;padding: max(8px,env(safe-area-inset-top)) 12px max(7px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:clamp(5px,1vh,10px);overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;min-height:42px}
.brand{min-width:0}
h1{margin:0;color:var(--acc);font-size:clamp(21px,5.8vw,29px);line-height:1.05}
.sub{font-size:clamp(10px,2.8vw,13px);color:var(--mute);margin-top:2px}
.love{display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.heart{color:var(--acc);font-size:22px;line-height:1}
.lbar{width:clamp(45px,15vw,85px);height:9px;background:var(--bar);border-radius:9px;overflow:hidden}
.lbar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.room-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}
.room-tab{border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:7px 3px;font-size:clamp(12px,3.4vw,15px);font-weight:bold;cursor:pointer}
.room-tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.scene{flex:1 1 auto;min-height:0;max-height:42vh;overflow:hidden;border:3px solid var(--line);border-radius:16px;background:var(--wall);display:flex;align-items:center;justify-content:center}
.scene svg{width:100%;height:100%;display:block;object-fit:contain}

.scene svg{width:100%;height:100%;display:block}
.kid-arrive{animation:kidFadeIn .65s ease-out both}
@keyframes kidFadeIn{from{opacity:0}to{opacity:1}}

.bubble{position:relative;flex:none;min-height:42px;max-height:54px;display:flex;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:7px 11px;font-size:clamp(13px,3.5vw,16px);line-height:1.2;overflow:hidden}
.bubble:before{content:"";position:absolute;top:-8px;left:50%;border:7px solid transparent;border-top:0;border-bottom-color:var(--line)}
.stats{flex:none;display:grid;grid-template-columns:repeat(2,1fr);gap:5px 12px}
.stat{font-size:clamp(11px,3vw,13px);line-height:1.1}
.stat-line{display:flex;justify-content:space-between;gap:4px}
.bar{height:8px;background:var(--bar);border-radius:8px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:8px;transition:width .3s}
.actions{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.actions .action:nth-child(3):last-child{grid-column:1 / -1;width:50%;justify-self:center}
.action{min-height:43px;padding:6px 4px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:clamp(13px,3.5vw,16px);line-height:1.1;cursor:pointer}
.action small{display:block;color:var(--mute);font-size:10px;margin-top:2px}
.action:disabled{opacity:.45}
.footer{flex:none;text-align:center;color:var(--mute);font-size:10px;min-height:14px}
.reset{border:0;background:none;text-decoration:underline;color:var(--mute);font-size:10px;padding:0 3px;cursor:pointer}
@media (max-height:700px){.app{gap:5px;padding-top:max(5px,env(safe-area-inset-top));padding-bottom:max(4px,env(safe-area-inset-bottom))}.scene{max-height:38vh}.room-tab{padding:5px 2px}.action{min-height:38px;padding:4px}.bubble{min-height:37px}.bar{height:7px}}
@media (max-width:360px){.app{padding-left:8px;padding-right:8px}.action{font-size:12px}.action small{font-size:9px}.room-tab{font-size:12px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

    <div class="brand"><h1>MaGrandMère.com</h1><div class="sub">Prends soin de ta mamie, elle ne rajeunit pas.</div></div>

  </header>

  <nav class="room-tabs" aria-label="Choisir une pièce">
    <button class="room-tab" data-room="salon" aria-selected="true">Salon</button>

    <button class="room-tab" data-room="jardin" aria-selected="false">Jardin</button>

  <div class="bubble" id="say" aria-live="polite">Bonjour mon petit, entre donc ! Tu veux un bonbon ?</div>
  <div class="stats" id="stats"></div>
  <div class="actions" id="actions"></div>

};

const actions={
salon:[
{id:"tricot",title:"Tricoter",detail:"+ humeur, + amour",cool:2,run(){S.h+=12;S.e-=12;S.r-=4;S.rows++;if(S.rows>=5){S.rows=0;S.scarves++;S.love+=5;say("Une écharpe pour les petits-enfants ! Ils vont être contents.");return true;}return false;},lines:["Une maille à l’endroit, une maille à l’envers…","Ça sera un pull. Ou une écharpe. On verra."]},
{id:"journal",title:"Lire le journal",detail:"+ humeur",cool:4,run(){S.h+=25;S.e-=3;},lines:["Regarde-moi ça, les prix ont encore augmenté !","Tiens, un avis de décès… ah, c’est le voisin."]},
{id:"sieste",title:"Faire une sieste",detail:"+ énergie",cool:20,run(){S.e+=40;S.r-=5;},lines:["Zzz… je ne dormais pas, je me reposais les yeux.","Réveille-moi pour le feuilleton."]}
],
cuisine:[
{id:"soupe",title:"Manger une soupe",detail:"+ repas",cool:3,run(){S.r+=35;S.h+=3;},lines:["Mmh, un peu de sel et ce serait parfait.","Dans mon temps, on la faisait avec de vrais poireaux."]},
{id:"gateau",title:"Faire un gâteau",detail:"+ humeur, + amour",cool:6,run(){S.h+=15;S.e-=10;S.r+=5;S.love+=3;S.cakes++;},lines:["Un gâteau au chocolat pour les petits. Pas touche avant le goûter !","Une pincée de cannelle, c’est mon secret. Chut !"]},
{id:"med",title:"Prendre les médicaments",detail:"+ santé",cool:3,run(){S.s+=35;},lines:["Le rose, pas le bleu ! … Ou l’inverse ?","Tu as vu mes lunettes ? Ah, elles sont sur mon nez."]}
],
jardin:[
{id:"weeds",title:"Enlever les mauvaises herbes",detail:"+ humeur",cool:5,run(){S.h+=18;S.e-=9;},lines:["Voilà, le jardin respire mieux !","Ces mauvaises herbes poussent plus vite que mes rosiers !"]},
{id:"roses",title:"Planter des roses",detail:"+ humeur, + amour",cool:7,run(){S.h+=15;S.e-=8;S.love+=3;},lines:["Des roses pour embaumer le jardin…","J’espère que les petits viendront les voir fleurir."]},
{id:"birds",title:"Regarder les oiseaux",detail:"+ humeur, + énergie",cool:4,run(){S.h+=12;S.e+=8;},lines:["Écoute ce petit merle, il a une jolie voix !","Les oiseaux sont les meilleurs visiteurs."]}
]};

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function decay(){const now=Date.now(),minutes=Math.min(480,(now-S.last)/60000);S.last=now;Object.keys(rates).forEach(k=>S[k]-=rates[k]*minutes);clamp();}
function renderStats(){
$("stats").innerHTML=["r","s","h","e"].map(k=>{const v=Math.round(S[k]);return `<div class="stat"><div class="stat-line"><b>${statNames[k]}</b><b>${v}%</b></div><div class="bar"><i style="width:${v}%;background:${statColors[k]}"></i></div></div>`}).join("");
$("lovebar").style.width=Math.min(10,S.love)*10+"%";$("lovenum").textContent=Math.min(10,Math.floor(S.love))+"/10";
}
function renderActions(){
$("actions").innerHTML=actions[room].map(a=>`<button class="action" data-action="${a.id}">${a.title}<small>${a.detail}</small></button>`).join("");
$("actions").querySelectorAll("button").forEach(btn=>btn.addEventListener("click",()=>doAction(btn.dataset.action)));
}
function kidsDrawing(){
const child=(x,y,scale,shirt,hair,outline)=>`<g class="kid-arrive" transform="translate(${x} ${y}) scale(${scale})">
  <path d="M17 246L14 271M39 246L43 271" stroke="#704b35" stroke-width="6" stroke-linecap="round"/>
  <path d="M12 211Q28 203 44 211L47 246Q29 255 10 246Z" fill="${shirt}" stroke="${outline}" stroke-width="2"/>
  <circle cx="28" cy="190" r="18" fill="#f1c9a8"/>
  <path d="M10 188Q8 166 29 168Q47 169 46 188Q34 179 10 188Z" fill="${hair}"/>
  <circle cx="22" cy="191" r="2.5" fill="#493324"/><circle cx="34" cy="191" r="2.5" fill="#493324"/>
  <path d="M22 199q6 5 12 0" fill="none" stroke="#a84d5b" stroke-width="2" stroke-linecap="round"/>
  <path d="M12 218L2 231m34-13l11 12" stroke="#f1c9a8" stroke-width="6" stroke-linecap="round"/>
</g>`;
return `<g id="visiting-kids">
  ${child(5,27,.90,"#e3a34c","#76513b","#9b6a3e")}
  ${child(76,48,.78,"#d985a7","#76513b","#a95d7d")}
  ${child(330,66,.68,"#78a8c8","#a66d42","#557b99")}
</g>`;
}
function renderRoom(){
let svg=scenes[room];
if(kidsVisible) svg=svg.replace("</svg>",kidsDrawing()+"</svg>");
$("scene").innerHTML=svg;
document.querySelectorAll(".room-tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.room===room)));
renderActions();
}
function render(){renderStats();renderActions();updateCooldowns();}
function updateCooldowns(){
document.querySelectorAll(".action").forEach(b=>{const until=cooldowns[b.dataset.action]||0;b.disabled=until>Date.now();});
}
function visit(){
if(S.love>=10&&!visitTimer){
S.visits++;S.h+=35;S.s+=10;S.e+=10;S.love=0;clamp();
kidsVisible=true;
visitTimer=setTimeout(()=>{
  visitTimer=null;
  say("Mamie ! Mamie ! On est arrivés ! — Mes petits trésors ! Venez me faire un câlin !");
  save();renderRoom();renderStats();
  if(kidsTimeout)clearTimeout(kidsTimeout);
  kidsTimeout=setTimeout(()=>{kidsVisible=false;renderRoom();},18000);
},350);
}
}
function doAction(id){
const a=actions[room].find(x=>x.id===id);if(!a)return;
decay();
if(id==="soupe"&&S.r>92){say("Merci, j’ai déjà trop mangé !");return;}
if(id==="sieste"&&S.e>92){say("Je n’ai pas sommeil, je ne suis pas une petite vieille !");return;}
const special=a.run();clamp();
if(!special)say(a.lines[Math.floor(Math.random()*a.lines.length)]);
cooldowns[id]=Date.now()+a.cool*1000;visit();save();renderStats();updateCooldowns();
setTimeout(updateCooldowns,a.cool*1000+60);
}
document.querySelectorAll(".room-tab").forEach(b=>b.addEventListener("click",()=>{room=b.dataset.room;renderRoom();}));
$("reset").addEventListener("click",()=>{if(confirm("Tout recommencer avec Roseli ?")){S={...initial,last:Date.now()};cooldowns={};kidsVisible=false;if(kidsTimeout)clearTimeout(kidsTimeout);if(visitTimer)clearTimeout(visitTimer);visitTimer=null;save();say("Bonjour mon petit, entre donc ! Tu veux un bonbon ?");renderRoom();renderStats();}});
renderRoom();clamp();renderStats();save();
setInterval(()=>{decay();save();renderStats();updateCooldowns();},10000);
setInterval(()=>{if(Date.now()<(visitTimer||0))return;const low=mood();if(low<20)say("J’ai besoin d’un peu d’attention, mon petit…");else if(low>60)say(["Quel beau temps aujourd’hui !","Tu as mis une veste ? Il fait frais.","Tu manges bien, au moins ?"][Math.floor(Math.random()*3)]);},25000);
})();
</script>
